<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5d000" />
  <meta name="description" content="Tracker progresi calisthenics: Push, Pull, Squat, Muscle-up." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Calisthenics" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Calisthenics Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-level" id="heroLevel">L1</div>
    </header>

    <!-- HOME -->
    <section id="panel-home" class="panel active" role="tabpanel">
      <div class="path-grid" id="pathGrid"></div>
      <div id="pathDetail"></div>
    </section>

    <!-- WORKOUT -->
    <section id="panel-workout" class="panel" role="tabpanel">
      <div id="workoutView"></div>
    </section>

    <!-- HISTORY -->
    <section id="panel-history" class="panel" role="tabpanel">
      <div class="panel-head"><h2>Riwayat</h2></div>
      <div id="historyCalendar" class="log-calendar" aria-label="Kalender latihan"></div>
      <div id="historyList"></div>
      <div class="actions history-actions">
        <button type="button" class="btn secondary" id="btnExportHistory">Export</button>
        <button type="button" class="btn secondary" id="btnImportHistory">Import</button>
        <button type="button" class="btn ghost" id="btnReset">Reset data</button>
        <input type="file" id="importHistoryFile" accept="application/json,.json" hidden />
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="panel-settings" class="panel" role="tabpanel">
      <div class="panel-head"><h2 id="settingsTitle">Setting</h2></div>
      <div id="settingsMenu" class="settings-menu"></div>
      <div id="settingsSchedule" class="settings-sub" hidden>
        <div class="schedule-options" id="scheduleOptions"></div>
        <div id="weekPreview"></div>
        <div id="baselineBlock" style="margin-top:0.65rem"></div>
      </div>
      <div id="settingsAbout" class="settings-sub about-card" hidden></div>
    </section>

  </div>

  <nav class="tabs" role="tablist" aria-label="Navigasi utama">
    <button class="tab" role="tab" aria-selected="true" data-tab="home">Jalur</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="workout">Sesi</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="history">Log</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings">Setting</button>
  </nav>

  <div class="rest-bar" id="restBar" aria-live="polite">
    <div>
      <div class="rest-label">Istirahat</div>
      <div class="rest-time" id="restTime">0:00</div>
    </div>
    <div class="rest-actions">
      <button type="button" class="btn secondary" id="restSkip" style="background:var(--yellow);color:var(--ink)">Selesai</button>
      <button type="button" class="btn ghost" id="restAdd" style="color:var(--paper);border-color:#555">+30s</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
